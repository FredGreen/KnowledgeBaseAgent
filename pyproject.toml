[project]
name = "intelligent-qa-agent"
version = "0.1.0"
description = "智能问答 Agent 桌面应用 - 本地知识库 + 多模型问答"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "langchain==1.1.2",
    "langchain-core==1.1.2",
    "langgraph>=1.0.2,<1.1.0",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.0",
    "pymilvus>=2.4",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "keyring>=25.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
qa-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
