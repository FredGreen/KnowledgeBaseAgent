[project]
name = "intelligent-qa-agent"
version = "0.1.0"
description = "智能问答 Agent 桌面应用 - 本地知识库 + 多模型问答"
requires-python = ">=3.10"
dependencies = [
    # GUI 框架
    "PyQt6>=6.6",
    "qasync>=0.27",

    # LangChain 核心框架
    "langchain==1.2.12",
    "langchain-core==1.2.18",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",

    # LangGraph Agent 编排
    "langgraph==1.1.2",

    # 大模型供应商适配器
    "langchain-openai==1.1.11",
    "langchain-anthropic==1.3.4",
    "langchain-deepseek==1.0.1",
    "dashscope==1.25.6",
    "openai==2.26.0",
    "anthropic==0.84.0",

    # 向量数据库
    "langchain-milvus==0.3.3",
    "pymilvus==2.6.12",

    # Embedding / Tokenizer / 文本处理
    "tiktoken==0.12.0",
    "numpy==2.4.4",

    # 文档解析
    "pypdf==6.10.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "Markdown==3.10.2",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.0",

    # 配置管理 / 数据校验
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",

    # HTTP 客户端
    "httpx==0.28.1",
    "requests==2.32.5",

    # 重试机制
    "tenacity==9.1.4",

    # 密钥管理
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
qa-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
